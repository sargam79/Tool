<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Crystal Runner</title>
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#0a1830">
</head>
<body>
<div id="app">

  <div id="loadingScreen" class="loading-screen">
    <img src="assets/images/crystal_icon.png" class="loading-icon" alt="">
    <div class="loading-bar-track"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
    <div class="loading-text">Loading Crystal Runner…</div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <div id="touchLayer"></div>

  <!-- HUD -->
  <div id="hud" class="hud hidden">
    <div class="score-panel">
      <img src="assets/images/score_badge.png" class="score-badge-bg" alt="">
      <span class="score-value" id="scoreValue">0</span>
    </div>
    <div class="sub-counters">
      <div class="counter-chip"><img src="assets/images/coin_icon.png"><span id="coinValue">0</span></div>
      <div class="counter-chip"><img src="assets/images/crystal_icon.png"><span id="crystalValue">0</span></div>
    </div>
    <button class="icon-btn hud-pause" id="pauseBtn"><img src="assets/images/pause_icon.png"></button>
    <div id="powerupBar" class="powerup-bar"></div>
  </div>

  <!-- Start screen -->
  <div id="startScreen" class="screen">
    <img src="assets/images/decor_island.png" class="decor-island" alt="">
    <div class="screen-inner">
      <h1 class="game-title">Crystal <span>Runner</span></h1>
      <p class="game-subtitle">Run the endless canyon. Collect the light. Survive.</p>
      <img src="assets/images/hero_portrait.png" class="hero-portrait" alt="Hero">
      <button class="play-btn" id="startBtn"><img src="assets/images/play_button.png" alt="Play"></button>
      <div class="start-stats">
        <img src="assets/images/coin_icon.png" class="mini-icon"><span id="startCoins">0</span>
        <span class="dot">•</span>
        <img src="assets/images/crystal_icon.png" class="mini-icon"><span id="startBest">0</span>
      </div>
      <p class="controls-hint">Swipe or Arrow Keys: ← → change lane · ↑ jump · ↓ slide</p>
    </div>
  </div>

  <!-- Pause screen -->
  <div id="pauseScreen" class="screen hidden">
    <div class="screen-inner pause-panel">
      <h2 class="menu-title">Paused</h2>
      <div class="menu-buttons">
        <button class="menu-btn" id="resumeBtn"><img src="assets/images/confirm_icon.png"><span>Resume</span></button>
        <button class="menu-btn" id="restartFromPauseBtn"><img src="assets/images/restart_icon.png"><span>Restart</span></button>
        <button class="menu-btn" id="homeFromPauseBtn"><img src="assets/images/home_icon.png"><span>Home</span></button>
      </div>
    </div>
  </div>

  <!-- Game Over screen -->
  <div id="gameOverScreen" class="screen hidden">
    <div class="screen-inner result-panel">
      <img src="assets/images/gameover_banner.png" class="banner-image" alt="Game Over">
      <div class="result-stats">
        <div class="result-row"><span class="result-label">Score</span><span class="result-value" id="finalScore">0</span></div>
        <div class="result-row"><span class="result-label">Best Score</span><span class="result-value gold" id="finalBest">0</span></div>
        <div class="result-row"><span class="result-label">Crystals</span><span class="result-value"><img src="assets/images/crystal_icon.png" class="mini-icon"><span id="finalCrystals">0</span></span></div>
        <div class="result-row"><span class="result-label">Coins</span><span class="result-value"><img src="assets/images/coin_icon.png" class="mini-icon"><span id="finalCoins">0</span></span></div>
      </div>
      <div class="result-buttons">
        <button class="ghost-btn" id="homeFromGameOverBtn"><img src="assets/images/home_icon.png"><span>Home</span></button>
        <button class="ghost-btn primary" id="restartFromGameOverBtn"><img src="assets/images/restart_icon.png"><span>Restart</span></button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/assetLoader.js"></script>
<script src="js/soundManager.js"></script>
<script src="js/inputManager.js"></script>
<script src="js/runnerLogic.js"></script>
<script src="js/sceneManager.js"></script>
<script src="js/uiManager.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
