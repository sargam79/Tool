<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Evolution</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9);
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.12);
    }
    canvas {
      display: block;
      background-color: #1a2318;
    }

    /* Top HUD Bar */
    #ui-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-weight: bold;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .btn {
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      object-fit: contain;
    }
    .btn:hover {
      transform: scale(1.12);
    }
    .btn:active {
      transform: scale(0.92);
    }
    .icon-btn {
      width: 42px;
      height: 42px;
    }

    /* Screen Overlays */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 26, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }
    .overlay-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Start Menu */
    .logo-img {
      width: 320px;
      max-width: 80%;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .play-btn {
      width: 180px;
      height: auto;
    }

    /* Pause & Game Over */
    .title-text {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    .trophy-banner {
      width: 76px;
      height: 76px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .stats-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px 32px;
      border-radius: 16px;
      font-size: 18px;
      line-height: 1.8;
      text-align: center;
    }
    .action-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Top HUD Overlay -->
    <div id="ui-overlay">
      <div class="hud-box">
        <div class="hud-item">
          <img src="apple.png" class="hud-icon" alt="Score">
          <span id="score-val" style="color:#2ed573;">0</span>
        </div>
        <div class="hud-item">
          <img src="trophy.png" class="hud-icon" alt="Level">
          <span id="level-val" style="color:#ffa502;">1</span>
        </div>
        <div class="hud-item">
          <img src="heart.png" class="hud-icon" alt="Lives">
          <span id="lives-val" style="color:#ff4757;">1</span>
        </div>
        <div class="hud-item" style="margin-left: 6px;">
          <span id="form-val" style="color:#70a1ff; font-weight:600;">Green Snake</span>
        </div>
      </div>

      <div class="btn-group">
        <img id="pause-btn" class="btn icon-btn" src="pausebutton.png" alt="Pause" />
        <img id="sound-btn" class="btn icon-btn" src="file_000000004af4820bafe51502a527e7dd.png" alt="Sound" />
        <img id="settings-btn" class="btn icon-btn" src="settings.png" alt="Settings" />
      </div>
    </div>

    <!-- Start Screen Overlay -->
    <div id="start-screen" class="overlay-screen active">
      <img src="gamelogo.png" class="logo-img" alt="Snake Evolution Logo">
      <img id="start-play-btn" class="btn play-btn" src="playbutton.png" alt="Play Game">
    </div>

    <!-- Pause Screen Overlay -->
    <div id="pause-screen" class="overlay-screen">
      <h1 class="title-text" style="color: #38ef7d;">GAME PAUSED</h1>
      <div class="action-row">
        <img id="resume-btn" class="btn play-btn" src="playbutton.png" alt="Resume Game" style="width: 150px;">
        <img id="pause-home-btn" class="btn icon-btn" src="home.png" alt="Home" style="width: 58px; height: 58px;">
      </div>
    </div>

    <!-- Game Over Screen Overlay -->
    <div id="game-over-screen" class="overlay-screen">
      <img src="trophy.png" class="trophy-banner" alt="Trophy">
      <h1 class="title-text" style="color: #ff4757;">GAME OVER</h1>
      <div class="stats-card">
        Final Score: <span id="final-score" style="color: #2ed573; font-weight: bold;">0</span><br/>
        Snake Level: <span id="final-level" style="color: #ffa502; font-weight: bold;">1</span>
      </div>
      <div class="action-row">
        <img id="restart-btn" class="btn icon-btn" src="restart.png" alt="Restart" style="width: 64px; height: 64px;">
        <img id="gameover-home-btn" class="btn icon-btn" src="home.png" alt="Home" style="width: 64px; height: 64px;">
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreEl = document.getElementById('score-val');
    const levelEl = document.getElementById('level-val');
    const livesEl = document.getElementById('lives-val');
    const formEl = document.getElementById('form-val');
    const finalScoreEl = document.getElementById('final-score');
    const finalLevelEl = document.getElementById('final-level');

    // Screens
    const startScreen = document.getElementById('start-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const gameOverScreen = document.getElementById('game-over-screen');

    // Buttons
    const startPlayBtn = document.getElementById('start-play-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const soundBtn = document.getElementById('sound-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const pauseHomeBtn = document.getElementById('pause-home-btn');
    const restartBtn = document.getElementById('restart-btn');
    const gameoverHomeBtn = document.getElementById('gameover-home-btn');

    // Asset Loader
    const assets = {};
    const assetSources = {
      bg: 'background.png',
      snakeHead: 'snake_head_green.png',
      snakeBody: 'snake_body_green.png',
      snakeTail: 'snake_tail_green.png',
      apple: 'apple.png',
      coin: 'coin.png',
      gem: 'gem.png',
      chest: 'treasurechest.png',
      potion: 'potion.png',
      heart: 'heart.png',
      trophy: 'trophy.png',
      eatEffect: 'eat-effect.png',
      sparkEffect: 'spark-effect.png'
    };

    let loadedCount = 0;
    const totalAssets = Object.keys(assetSources).length;

    for (const [key, src] of Object.entries(assetSources)) {
      assets[key] = new Image();
      assets[key].src = src;
      assets[key].onload = () => {
        loadedCount++;
        if (loadedCount === totalAssets) {
          renderInitialBackground();
        }
      };
    }

    // Grid Setup
    const GRID_SIZE = 32;
    const COLS = canvas.width / GRID_SIZE;
    const ROWS = canvas.height / GRID_SIZE;

    // Game Variables
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let items = [];
    let score = 0;
    let level = 1;
    let lives = 1;
    let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'GAMEOVER'
    let soundMuted = false;
    let effects = [];
    let lastTime = 0;
    const moveInterval = 110;

    const EVOLUTIONS = [
      { minLvl: 30, name: 'Dragon Snake', glow: '#8854d0' },
      { minLvl: 20, name: 'Electric Snake', glow: '#fed330' },
      { minLvl: 10, name: 'Ice Snake', glow: '#2bcbba' },
      { minLvl: 5,  name: 'Fire Snake', glow: '#ee5253' },
      { minLvl: 1,  name: 'Green Snake', glow: '#26de81' }
    ];

    function getEvolution(lvl) {
      return EVOLUTIONS.find(e => lvl >= e.minLvl) || EVOLUTIONS[EVOLUTIONS.length - 1];
    }

    // Controls
    window.addEventListener('keydown', e => {
      if (gameState !== 'PLAYING') return;
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
          if (dir.y === 0) nextDir = { x: 0, y: -1 };
          break;
        case 'ArrowDown': case 's': case 'S':
          if (dir.y === 0) nextDir = { x: 0, y: 1 };
          break;
        case 'ArrowLeft': case 'a': case 'A':
          if (dir.x === 0) nextDir = { x: -1, y: 0 };
          break;
        case 'ArrowRight': case 'd': case 'D':
          if (dir.x === 0) nextDir = { x: 1, y: 0 };
          break;
      }
    });

    // Button Listeners
    startPlayBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', startGame);
    pauseHomeBtn.addEventListener('click', showStartMenu);
    gameoverHomeBtn.addEventListener('click', showStartMenu);
    soundBtn.addEventListener('click', () => {
      soundMuted = !soundMuted;
      soundBtn.style.opacity = soundMuted ? '0.4' : '1.0';
    });

    function showStartMenu() {
      gameState = 'START';
      pauseScreen.classList.remove('active');
      gameOverScreen.classList.remove('active');
      startScreen.classList.add('active');
      renderInitialBackground();
    }

    function togglePause() {
      if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        pauseScreen.classList.add('active');
      } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        pauseScreen.classList.remove('active');
        requestAnimationFrame(gameLoop);
      }
    }

    function startGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      lives = 1;
      effects = [];
      items = [];

      spawnItem('apple');
      spawnItem('coin');
      updateHUD();

      startScreen.classList.remove('active');
      pauseScreen.classList.remove('active');
      gameOverScreen.classList.remove('active');

      gameState = 'PLAYING';
      requestAnimationFrame(gameLoop);
    }

    function spawnItem(type = null) {
      let x, y, valid = false;
      while (!valid) {
        x = Math.floor(Math.random() * COLS);
        y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(s => s.x === x && s.y === y) && !items.some(i => i.x === x && i.y === y);
      }

      if (!type) {
        const rand = Math.random();
        if (rand < 0.40) type = 'apple';
        else if (rand < 0.65) type = 'coin';
        else if (rand < 0.80) type = 'gem';
        else if (rand < 0.88) type = 'potion';
        else if (rand < 0.94) type = 'chest';
        else type = 'heart';
      }

      items.push({ x, y, type });
    }

    function updateHUD() {
      scoreEl.innerText = score;
      levelEl.innerText = level;
      livesEl.innerText = lives;
      const currentEvo = getEvolution(level);
      formEl.innerText = currentEvo.name;
    }

    function gameLoop(time = 0) {
      if (gameState === 'PLAYING') {
        if (time - lastTime > moveInterval) {
          update();
          lastTime = time;
        }
        render();
        requestAnimationFrame(gameLoop);
      }
    }

    function update() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Collision checks
      let hasCollision = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
                         snake.some(segment => segment.x === head.x && segment.y === head.y);

      if (hasCollision) {
        if (lives > 1) {
          lives--;
          updateHUD();
          dir = { x: -dir.x, y: -dir.y };
          nextDir = { ...dir };
          return;
        } else {
          triggerGameOver();
          return;
        }
      }

      snake.unshift(head);

      // Item pickup checks
      const itemIdx = items.findIndex(i => i.x === head.x && i.y === head.y);
      if (itemIdx !== -1) {
        const item = items[itemIdx];
        items.splice(itemIdx, 1);

        let fxImg = assets.eatEffect;

        switch (item.type) {
          case 'apple':
            score += 10;
            break;
          case 'coin':
            score += 15;
            break;
          case 'gem':
            score += 35;
            fxImg = assets.sparkEffect;
            break;
          case 'chest':
            score += 100;
            fxImg = assets.sparkEffect;
            break;
          case 'potion':
            score = Math.max(0, score - 15);
            if (snake.length > 3) snake.pop();
            break;
          case 'heart':
            lives++;
            fxImg = assets.sparkEffect;
            break;
        }

        level = Math.floor(score / 50) + 1;

        effects.push({
          x: head.x * GRID_SIZE + GRID_SIZE / 2,
          y: head.y * GRID_SIZE + GRID_SIZE / 2,
          img: fxImg,
          scale: 0.2,
          alpha: 1.0
        });

        updateHUD();
        spawnItem();
        if (items.length < 2) spawnItem();
      } else {
        snake.pop();
      }

      // FX Animations
      for (let i = effects.length - 1; i >= 0; i--) {
        const fx = effects[i];
        fx.scale += 0.06;
        fx.alpha -= 0.09;
        if (fx.alpha <= 0) effects.splice(i, 1);
      }
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      finalScoreEl.innerText = score;
      finalLevelEl.innerText = level;
      gameOverScreen.classList.add('active');
    }

    function renderInitialBackground() {
      if (assets.bg.complete) {
        ctx.drawImage(assets.bg, 0, 0, canvas.width, canvas.height);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Background
      if (assets.bg.complete) {
        ctx.drawImage(assets.bg, 0, 0, canvas.width, canvas.height);
      }

      const evo = getEvolution(level);

      // 2. Draw Food & Powerups
      for (const item of items) {
        const ix = item.x * GRID_SIZE;
        const iy = item.y * GRID_SIZE;
        let img = assets.apple;

        if (item.type === 'coin') img = assets.coin;
        if (item.type === 'gem') img = assets.gem;
        if (item.type === 'chest') img = assets.chest;
        if (item.type === 'potion') img = assets.potion;
        if (item.type === 'heart') img = assets.heart;

        if (img.complete) {
          ctx.drawImage(img, ix + 2, iy + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        }
      }

      // 3. Draw Snake Body & Head
      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const sx = seg.x * GRID_SIZE + GRID_SIZE / 2;
        const sy = seg.y * GRID_SIZE + GRID_SIZE / 2;

        ctx.save();
        ctx.translate(sx, sy);

        if (i === 0) {
          let angle = Math.atan2(dir.y, dir.x);
          ctx.rotate(angle + Math.PI / 2);
          ctx.shadowColor = evo.glow;
          ctx.shadowBlur = 12;
          ctx.drawImage(assets.snakeHead, -GRID_SIZE / 2, -GRID_SIZE / 2, GRID_SIZE, GRID_SIZE);
        } else if (i === snake.length - 1) {
          const prev = snake[i - 1];
          let angle = Math.atan2(seg.y - prev.y, seg.x - prev.x);
          ctx.rotate(angle);
          ctx.drawImage(assets.snakeTail, -GRID_SIZE / 2, -GRID_SIZE / 2, GRID_SIZE, GRID_SIZE);
        } else {
          const prev = snake[i - 1];
          let angle = Math.atan2(prev.y - seg.y, prev.x - seg.x);
          ctx.rotate(angle);
          ctx.drawImage(assets.snakeBody, -GRID_SIZE / 2, -GRID_SIZE / 2, GRID_SIZE, GRID_SIZE);
        }

        ctx.restore();
      }

      // 4. Draw Effects
      for (const fx of effects) {
        if (fx.img.complete) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, fx.alpha);
          const size = GRID_SIZE * 3.5 * fx.scale;
          ctx.drawImage(fx.img, fx.x - size / 2, fx.y - size / 2, size, size);
          ctx.restore();
        }
      }
    }
  </script>
</body>
</html>
